services:
  sidequest:
    build: .
    container_name: sidequest
    restart: unless-stopped
    networks:
      - traefik-proxy
    env_file:
      # optional: falls keine .env auf dem Host liegt, startet der Container
      # trotzdem (App läuft dann im Demo-Modus, siehe server/index.js).
      - path: .env
        required: false
    environment:
      - DATA_DIR=/data
    volumes:
      # SQLite = Source of Truth der Einlösungen. Dieses Volume ist heilig:
      # geht es verloren, zählt nur noch der (nachlaufende) Sheet-Spiegel.
      - sable_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.sidequest.rule=Host(`halovisionai.cloud`) && PathPrefix(`/sidequest`)
      - traefik.http.routers.sidequest.entrypoints=websecure
      - traefik.http.routers.sidequest.tls.certresolver=letsencrypt
      # Bare "/sidequest" (ohne trailing slash) zuerst auf "/sidequest/" umleiten:
      # index.html referenziert CSS/JS/API relativ, das geht nur mit korrektem
      # Verzeichnis-Pfad in der Adressleiste.
      - traefik.http.middlewares.sidequest-redirect.redirectregex.regex=^(https?://[^/]+)/sidequest$$
      - traefik.http.middlewares.sidequest-redirect.redirectregex.replacement=$${1}/sidequest/
      - traefik.http.middlewares.sidequest-redirect.redirectregex.permanent=true
      - traefik.http.middlewares.sidequest-strip.stripprefix.prefixes=/sidequest
      - traefik.http.routers.sidequest.middlewares=sidequest-redirect,sidequest-strip
      - traefik.http.services.sidequest.loadbalancer.server.port=8080

networks:
  traefik-proxy:
    external: true

volumes:
  sable_data:
