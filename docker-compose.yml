services:
  sable-platform:
    build: .
    image: sable-platform:latest
    restart: unless-stopped
    ports:
      # Hinter nginx/Traefik (Hostinger-Standard) nur an localhost binden;
      # für direkten Zugriff "127.0.0.1:" entfernen.
      # Host-Port bewusst unüblich gewählt (Kollisionen mit anderen Projekten
      # auf derselben VM vermeiden); Container-Port bleibt 8080.
      - "127.0.0.1:47821:8080"
    env_file:
      # optional: falls keine .env auf dem Host liegt, startet der Container
      # trotzdem (App läuft dann im Demo-Modus, siehe server/index.js).
      - path: .env
        required: false
    environment:
      - DATA_DIR=/data
    volumes:
      # SQLite = Source of Truth der Einlösungen. Dieses Volume ist heilig:
      # geht es verloren, zählt nur noch der (nachlaufende) Sheet-Spiegel.
      - sable_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sable_data:
